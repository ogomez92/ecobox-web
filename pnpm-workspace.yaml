# pnpm 11.4+ gates native build scripts behind an explicit allow-list and exits 1
# (ERR_PNPM_IGNORED_BUILDS) on any install/run until each is decided. These are
# trusted and MUST build, so they're set true here:
#   better-sqlite3 — native SQLite binding (node-gyp)
#   esbuild        — platform bundler binary
#   msedge-tts     — Edge read-aloud TTS postinstall
# Keep them true after a pnpm bump — if pnpm rewrites these to "set this to true
# or false", just set them back.
#
# The two false entries are deliberate, not undecided: @google/genai's only
# install-time hook is a no-op `preinstall` echo (its `prepare` is for git
# installs), and protobufjs's postinstall only wires up its CLI — neither is
# needed to call the Gemini REST API, and not running them is the safer default.
allowBuilds:
  '@google/genai': false
  better-sqlite3: true
  esbuild: true
  msedge-tts: true
  protobufjs: false

onlyBuiltDependencies:
  - better-sqlite3
  - esbuild
  - msedge-tts
