allowBuilds:
  better-sqlite3: set this to true or false
  esbuild: set this to true or false
  msedge-tts: set this to true or false
# Dependencies whose install/build scripts are allowed to run. pnpm blocks build
# scripts by default (supply-chain hardening); these are the ones this app needs:
#   better-sqlite3 — compiles its native SQLite binding (node-gyp)
#   esbuild        — fetches/links its platform binary
#   msedge-tts     — postinstall for the Edge read-aloud TTS engine
# Without this, `pnpm install`/`pnpm run build` abort with ERR_PNPM_IGNORED_BUILDS.
onlyBuiltDependencies:
  - better-sqlite3
  - esbuild
  - msedge-tts
